<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOMADIR - La solution de référence</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <div class="logo-icon">S</div>
            </div>
            <div class="header-text">
                <h1 class="title">SOMADIR</h1>
                <p class="subtitle">La solution de référence</p>
            </div>
        </header>

        <!-- Main Grid -->
        <main class="grid-container">
            <div class="grid-item top-left" data-section="produits">
                <div class="icon-wrapper">
                    <i class="fas fa-bread-slice"></i>
                </div>
                <h3>Produits</h3>
            </div>

            <div class="grid-item top-right" data-section="recettes">
                <div class="icon-wrapper">
                    <i class="fas fa-user-chef"></i>
                </div>
                <h3>Recettes</h3>
            </div>

            <div class="grid-item bottom-left" data-section="calculateur">
                <div class="icon-wrapper">
                    <i class="fas fa-calculator"></i>
                </div>
                <h3>Calculateur</h3>
            </div>

            <div class="grid-item bottom-right" data-section="agences">
                <div class="icon-wrapper">
                    <i class="fas fa-map-marker-alt"></i>
                </div>
                <h3>Agences</h3>
            </div>

            <div class="grid-item bottom-center" data-section="contact">
                <div class="icon-wrapper">
                    <i class="fas fa-phone"></i>
                </div>
                <h3>Contact</h3>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
