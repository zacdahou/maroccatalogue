<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Somadir — Accueil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="background-pattern" aria-hidden="true"></div>
  <header class="site-header" role="banner">
    <div class="logo" aria-label="Logo Somadir en orange" title="Logo Somadir">
      <span class="dot" aria-hidden="true"></span>
    </div>
    <div class="titles">
      <h1 class="brand">SOMADIR</h1>
      <p class="tagline">La solution de référence</p>
    </div>
  </header>

  <main class="home" role="main">
    <nav class="icon-grid" aria-label="Navigation principale">
      <a class="icon-card pos-top-left" href="#produits">
        <span class="icon" aria-hidden="true">🥖</span>
        <span class="label">Produits</span>
      </a>
      <a class="icon-card pos-top-right" href="#recettes">
        <span class="icon" aria-hidden="true">👨‍🍳</span>
        <span class="label">Recettes</span>
      </a>
      <a class="icon-card pos-bottom-left" href="#calculateur">
        <span class="icon" aria-hidden="true">🧮</span>
        <span class="label">Calculateur</span>
      </a>
      <a class="icon-card pos-bottom-right" href="#agences">
        <span class="icon" aria-hidden="true">📍</span>
        <span class="label">Agences</span>
      </a>
      <a class="icon-card pos-bottom-center" href="#contact">
        <span class="icon" aria-hidden="true">📞</span>
        <span class="label">Contact</span>
      </a>
    </nav>
  </main>
</body>
</html>
